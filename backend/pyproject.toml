[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--cov=accounts --cov=notes --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "*/apps.py", "manage.py", "config/*sgi.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
